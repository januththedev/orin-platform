name: consumer-contract

on:
  workflow_call:
    inputs:
      platform-tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
          cache: npm
      - run: test "$(git -C vendor/orin-platform describe --tags --exact-match)" = "${{ inputs.platform-tag }}"
      - run: npm ci
      - run: npm run test:platform
      - run: node tools/contracts/verify-consumer-manifest.mjs orin-platform.consumer.json
